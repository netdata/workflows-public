name: secret-scan

on:
  pull_request_target:
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLICY_OWNER: netdata
      POLICY_REPO: workflows-private
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - name: Get a read-only token for the policy repository
        id: policy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liCxqwxtOt1J0pDD
          private-key: ${{ secrets.SECRET_SCAN_APP_KEY }}
          owner: ${{ env.POLICY_OWNER }}
          repositories: ${{ env.POLICY_REPO }}
          permission-contents: read

      - name: Check out the central policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.POLICY_OWNER }}/${{ env.POLICY_REPO }}
          ref: master
          token: ${{ steps.policy-token.outputs.token }}
          persist-credentials: false
          path: policy

      - name: Check out the code under review (read only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit from the event, not a moving ref: a force push during
          # the run must not change what is scanned.
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          # Required for fork PRs under pull_request_target. Safe only because no
          # step ever builds, installs or runs anything from this checkout.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          lfs: false
          submodules: false
          path: target

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits this PR adds
        working-directory: target
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          # Gitleaks always reads .gitleaksignore from the scanned tree; a PR must not
          # be able to silence its own findings. Exceptions live only in the policy repo.
          rm -f .gitleaksignore

          # --text/--no-textconv/--no-ext-diff: a PR's .gitattributes (-diff, binary,
          # textconv) must not hide content from the scan.
          diff_opts="--text --no-textconv --no-ext-diff"

          # Scan 1, history: every commit the PR adds, so a secret added and later removed
          # is still caught. --remerge-diff covers content added inside merge commits.
          history_range="${BASE_SHA}..${HEAD_SHA}"
          # Gitleaks logs git errors instead of failing; run the same git log first so a
          # broken history fails the check instead of passing it.
          git log -p --remerge-diff --text --no-textconv --no-ext-diff "$history_range" > /dev/null

          # Scan 2, result: everything the PR adds since it branched off, as one
          # synthetic commit. Catches secrets split across commits and content that only
          # exists in a merge result (octopus merges have no remerge diff). Compared with
          # the fork point, not the current base, so changes on the base branch made after
          # the PR branched off are not attributed to the PR.
          fork_point=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          net_sha=$(GIT_AUTHOR_NAME=scan GIT_AUTHOR_EMAIL=scan@invalid GIT_AUTHOR_DATE="1700000000 +0000" \
            GIT_COMMITTER_NAME=scan GIT_COMMITTER_EMAIL=scan@invalid GIT_COMMITTER_DATE="1700000000 +0000" \
            git commit-tree "${HEAD_SHA}^{tree}" -p "$fork_point" -m "net diff")

          # Gitleaks exits 1 on errors, including partial scans; leaks get their own code.
          leaks_rc=42
          gitleaks_scan() { # <name> <log-opts>
            local rc=0
            # No --verbose: it prints the text around a finding, which can contain other secrets.
            "$RUNNER_TEMP/gitleaks" git . \
              --no-banner --redact \
              --ignore-gitleaks-allow \
              --exit-code "$leaks_rc" \
              --config ../policy/gitleaks/gitleaks.toml \
              --gitleaks-ignore-path ../policy/gitleaks \
              --log-opts "$2" \
              --report-format json --report-path "$RUNNER_TEMP/$1.json" \
              || rc=$?
            return "$rc"
          }

          rc_history=0
          gitleaks_scan history "--remerge-diff $diff_opts $history_range" || rc_history=$?
          rc_result=0
          gitleaks_scan result "$diff_opts ${fork_point}..${net_sha}" || rc_result=$?

          for rc in "$rc_history" "$rc_result"; do
            if [ "$rc" -ne 0 ] && [ "$rc" -ne "$leaks_rc" ]; then
              echo "::error::gitleaks failed with exit code $rc; the scan is incomplete"
              exit 2
            fi
          done

          if [ "$rc_history" -eq "$leaks_rc" ] || [ "$rc_result" -eq "$leaks_rc" ]; then
            {
              echo "## Possible credentials found"
              echo "Rotate any real credential: it is already readable in this branch."
              echo "False positive? Ask the security team to add the exception line below to the policy repository."
              echo "Findings in the combined PR change (scan \"result\") use the path:rule:line form."
              echo '```'
              jq -r '.[] | "history  \(.File|@json):\(.StartLine)  rule=\(.RuleID)  exception=\(.Fingerprint|@json)"' \
                "$RUNNER_TEMP/history.json"
              jq -r '.[] | "result   \(.File|@json):\(.StartLine)  rule=\(.RuleID)  exception=\(.Fingerprint | split(":") | .[1:] | join(":") | @json)"' \
                "$RUNNER_TEMP/result.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
