# Enforced on every PR by an enterprise ruleset ("Require workflows to pass before merging").
# GitHub ignores trigger filters for ruleset workflows and runs this on
# pull_request_target opened/synchronize/reopened and on merge_group checks_requested.
#
# pull_request_target is used because fork PRs get no secrets under pull_request.
# It runs with the base repository's context, so this workflow must never execute,
# build or install anything from the PR: it only reads git objects.
name: secret-scan

on:
  pull_request_target:
  merge_group:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # Documented workaround so the ruleset can run this workflow in other repositories
    # (actionlint reports it as a constant condition; that is expected).
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLICY_OWNER: netdata
      POLICY_REPO: workflows-private
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - name: Get a read-only token for the policy repository
        id: policy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The client ID is not secret. Hardcoded because Dependabot runs see no org variables.
          client-id: Iv23TODO # TODO: replace with the App's client ID before merging
          # Org Actions secret; for Dependabot PRs an org Dependabot secret with the same name.
          private-key: ${{ secrets.SECRET_SCAN_APP_KEY }}
          owner: ${{ env.POLICY_OWNER }}
          repositories: ${{ env.POLICY_REPO }}
          permission-contents: read

      - name: Check out the central policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.POLICY_OWNER }}/${{ env.POLICY_REPO }}
          ref: master
          token: ${{ steps.policy-token.outputs.token }}
          persist-credentials: false
          path: policy

      - name: Check out the code under review (read only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/pull/N/head exists in the base repository, also for fork PRs.
          ref: ${{ github.event_name == 'merge_group' && github.ref || format('refs/pull/{0}/head', github.event.pull_request.number) }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          path: target

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits this PR adds
        working-directory: target
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          # Gitleaks always reads .gitleaksignore from the scanned tree; a PR must not
          # be able to silence its own findings. Exceptions live only in the policy repo.
          rm -f .gitleaksignore

          # --remerge-diff: without it, secrets added inside a merge commit are missed.
          # --ignore-gitleaks-allow: inline "gitleaks:allow" comments are not honoured.
          rc=0
          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner --redact --verbose \
            --ignore-gitleaks-allow \
            --config ../policy/gitleaks/gitleaks.toml \
            --gitleaks-ignore-path ../policy/gitleaks \
            --log-opts "--remerge-diff ${BASE_SHA}..${HEAD_SHA}" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" || rc=$?

          if [ "$rc" -ne 0 ]; then
            {
              echo "## Possible credentials found"
              echo "Rotate any real credential: it is already readable in this branch."
              echo "False positive? Ask the security team to add the fingerprint below to the policy repository."
              echo '```'
              jq -r '.[] | "\(.File):\(.StartLine)  rule=\(.RuleID)  fingerprint=\(.Fingerprint)"' \
                "$RUNNER_TEMP/gitleaks.json" 2>/dev/null || echo "gitleaks failed (exit ${rc}); see the job log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
